name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .fvmrc.
  FLUTTER_VERSION: 3.47.5

jobs:
  # L1: analysis and widget tests, for the app and the Widgetbook.
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test widgetbook/lib
      - run: flutter analyze
      - run: flutter test
      - name: Test the evidence scripts
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: |
          flutter pub get
          flutter analyze

  # L3 on web: the browser accessibility tree, for the app and the Widgetbook.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_tests/package-lock.json
      - run: flutter build web
      - name: Build Widgetbook
        working-directory: widgetbook
        run: flutter build web
      - name: Install Playwright
        working-directory: web_tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Lists, without running, what each config selects: one tree spec per
      # technique folder and never a VoiceOver spec.
      - name: Check which specs the configs select
        working-directory: web_tests
        run: node --test check_spec_selection.js
      - name: Test the static server and the port choice
        working-directory: web_tests
        run: node --test support/support.test.js
      - name: App tree and keyboard tests
        working-directory: web_tests
        # playwright.config.js selects every web_tests/<id>_<name>.spec.js.
        run: npx playwright test
      - name: Widgetbook tests
        working-directory: web_tests
        run: npx playwright test -c widgetbook.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web_tests/test-results

  # L3 on Android: UI Automator against an emulator. The TalkBack walk skips
  # itself because TalkBack is not enabled here; speech runs are local
  # (python3 tool/talkback.py <ID>).
  android:
    runs-on: ubuntu-latest
    # tool/ci_android_tests.sh stops the tests after 50 minutes; the build
    # and the emulator's start take about 15 more.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The runner has 16 GB. android/gradle.properties gives Gradle 8 GB
      # of heap, for building on a developer's machine; here the emulator
      # needs the room. When a run was stopped for low memory (run
      # 44578213569, attempt 2) the emulator held 8.0 GB, Gradle's daemon
      # 5.0 GB, and two Kotlin compiler daemons 1.7 GB. The file in Gradle's
      # user home is read after the project's and replaces its values.
      - name: Give Gradle less memory on the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
          kotlin.compiler.execution.strategy=in-process
          EOF
      # android/gradlew is not committed (Flutter's default .gitignore); a
      # Flutter build generates it and warms the Gradle cache.
      - run: flutter build apk --debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          # A test that hangs fails after three minutes with a stack trace.
          # tool/ci_android_tests.sh runs the test classes four at a time,
          # each batch in a test process of its own: in one process for
          # every test the emulator's memory grew until the runner froze.
          # It stops the run, saves the state of the runner and the
          # emulator, and fails if no test starts or finishes for five
          # minutes, the runner runs low on memory, or the emulator exits.
          script: bash ../tool/ci_android_tests.sh -Pandroid.testInstrumentationRunnerArguments.timeout_msec=180000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics
          path: build/android-diagnostics
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: build/app/reports/androidTests

  # L3 on iOS: XCUITest on a simulator. The VoiceOver test needs Xcode 27 and
  # an iOS 27 simulator; with anything older it compiles to a skip, so speech
  # is only checked locally (python3 tool/voiceover_ios.py <ID>) until the hosted image
  # has them.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: UI tests
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          echo "Using simulator: $DEVICE"
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:RunnerUITests
