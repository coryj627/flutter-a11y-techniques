name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .fvmrc.
  FLUTTER_VERSION: 3.47.5

# Every job runs on a Namespace runner (namespace.so), not a GitHub-hosted
# one, through a runner profile of this repository's own:
#   fa11y-linux    4 vCPU,  8 GB, Ubuntu 26.04   analysis and web tests
#   fa11y-android  8 vCPU, 16 GB, Ubuntu 26.04   the Android emulator
#   fa11y-ios      6 vCPU, 14 GB, macOS Tahoe    the iOS simulator
# The hosted Linux runner left the emulator about 2 GB of memory, and device
# tests failed on timing there.
#
# The profiles have Namespace's Restricted access level: a job gets no
# access to the Namespace workspace. Keep it that way, and do not use a
# direct nscloud-* machine label here: this repository is public, a pull
# request's code runs in these jobs, and a direct label runs with the
# workspace's default access.
jobs:
  # L1: analysis and widget tests, for the app and the Widgetbook.
  analyze-test:
    runs-on: namespace-profile-fa11y-linux
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test widgetbook/lib
      - run: flutter analyze
      - run: flutter test
      - name: Test the evidence scripts
        run: python3 -m unittest discover -s tool -p 'test_*.py'
      - name: Analyze Widgetbook
        working-directory: widgetbook
        run: |
          flutter pub get
          flutter analyze

  # L3 on web: the browser accessibility tree, for the app and the Widgetbook.
  web:
    runs-on: namespace-profile-fa11y-linux
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web_tests/package-lock.json
      - run: flutter build web
      - name: Build Widgetbook
        working-directory: widgetbook
        run: flutter build web
      - name: Install Playwright
        working-directory: web_tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Lists, without running, what each config selects: one tree spec per
      # technique folder and never a VoiceOver spec.
      - name: Check which specs the configs select
        working-directory: web_tests
        run: node --test check_spec_selection.js
      - name: Test the static server and the port choice
        working-directory: web_tests
        run: node --test support/support.test.js
      - name: App tree and keyboard tests
        working-directory: web_tests
        # playwright.config.js selects every web_tests/<id>_<name>.spec.js.
        run: npx playwright test
      - name: Widgetbook tests
        working-directory: web_tests
        run: npx playwright test -c widgetbook.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web_tests/test-results

  # L3 on Android: UI Automator against an emulator. The TalkBack walk skips
  # itself because TalkBack is not enabled here; speech runs are local
  # (python3 tool/talkback.py <ID>).
  android:
    runs-on: namespace-profile-fa11y-android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # android/gradlew is not committed (Flutter's default .gitignore); a
      # Flutter build generates it and warms the Gradle cache.
      - run: flutter build apk --debug
      - name: Enable KVM
        # The emulator needs /dev/kvm, readable and writable by the runner's
        # user. Fails here, with a clear message, if the machine has none.
        run: |
          test -e /dev/kvm || { echo "::error::this runner has no /dev/kvm"; exit 1; }
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          # A test that hangs fails after three minutes with a stack trace.
          # tool/ci_android_tests.sh runs the test classes four at a time,
          # each batch in a test process of its own: in one process for
          # every test the emulator's memory grew until the runner froze.
          # It stops the run, saves the state of the runner and the
          # emulator, and fails if no test starts or finishes for five
          # minutes, the runner runs low on memory, or the emulator exits.
          script: bash ../tool/ci_android_tests.sh -Pandroid.testInstrumentationRunnerArguments.timeout_msec=180000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-diagnostics
          path: build/android-diagnostics
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-report
          path: build/app/reports/androidTests

  # L3 on iOS: XCUITest on a simulator. The VoiceOver test needs Xcode 27 and
  # an iOS 27 simulator; with anything older it compiles to a skip, so speech
  # is only checked locally (python3 tool/voiceover_ios.py <ID>) until the hosted image
  # has them.
  ios:
    runs-on: namespace-profile-fa11y-ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: UI tests
        working-directory: ios
        run: |
          # The image has simulators for several iOS versions. Take an
          # iPhone on the newest one this Xcode's SDK can run, by its id: a
          # name alone means "that name on the latest iOS", which may not
          # exist.
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          sdk = tuple(int(n) for n in sys.argv[1].split("."))
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              m = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              if version > sdk[:2]:
                  continue
              phones = sorted(d["name"] for d in devices if d["name"].startswith("iPhone"))
              if phones and (best is None or version > best[0]):
                  name = phones[0]
                  best = (version, next(d["udid"] for d in devices if d["name"] == name), name)
          if best is None:
              sys.exit("no iPhone simulator for an iOS this SDK can run")
          print(best[1])
          print("Using simulator: %s, iOS %d.%d" % (best[2], *best[0]), file=sys.stderr)
          ' "$SDK")
          xcodebuild -version
          xcodebuild test -workspace Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:RunnerUITests
